<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SECURE">
  <title>SECURE - Password Vault</title>
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/180/007aff/shield.png">
  <style>
    :root {
      --primary: #007aff;
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-border: #2c2c2e;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --danger: #ff453a;
      --success: #32d74b;
      --accent: #5e5ce6;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      user-select: none;
    }
    /* Lock Screen Overlay */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .shield-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #007aff, #5856d6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0, 122, 255, 0.4);
    }
    .shield-icon svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }
    .lock-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .lock-subtitle {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 30px;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      width: 100%;
      max-width: 320px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,255,255,0.15);
      margin-bottom: 16px;
    }
    .pin-container {
      margin-top: 10px;
      width: 100%;
      max-width: 320px;
      display: none;
    }
    .pin-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 20px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
    }
    .pin-btn {
      margin-top: 12px;
      width: 100%;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    /* Main App Header */
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-brand h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(50, 215, 75, 0.15);
      color: var(--success);
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Search & Filter */
    .controls {
      padding: 14px 20px 8px 20px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .categories::-webkit-scrollbar {
      display: none;
    }
    .cat-pill {
      white-space: nowrap;
      padding: 7px 14px;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Records List */
    .vault-container {
      padding: 10px 20px 60px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .record-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      transition: transform 0.15s ease;
    }
    .record-card:active {
      transform: scale(0.98);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .record-title {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
    }
    .record-meta {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
      word-break: break-all;
    }
    .action-row {
      display: flex;
      gap: 8px;
    }
    .act-btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      background: #2c2c2e;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .act-btn:active {
      background: #3a3a3c;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(30, 30, 30, 0.95);
      border: 1px solid #444;
      color: #fff;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
      opacity: 0;
      z-index: 10000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Detail Modal */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
    }
    .modal-sheet {
      background: #1c1c1e;
      width: 100%;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px 20px;
      border-top: 1px solid #333;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-sheet h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    .field-row {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .field-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field-val {
      font-size: 16px;
      word-break: break-all;
    }
    .close-modal {
      width: 100%;
      padding: 14px;
      background: #333;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      margin-top: 16px;
      cursor: pointer;
    }

    /* Added: setup / import / empty state */
    .pin-container.visible { display: block; }
    .pin-input + .pin-input { margin-top: 10px; }
    .lock-msg { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; text-align: center; }
    .lock-error { font-size: 12px; color: #ff453a; min-height: 16px; margin-top: 8px; text-align: center; }
    .reset-link { background: none; border: none; color: #8e8e93; font-size: 12px; margin-top: 18px; text-decoration: underline; cursor: pointer; width: 100%; }
    .empty-state { text-align: center; color: #8e8e93; padding: 48px 24px; line-height: 1.5; }
    .empty-state h3 { color: #fff; font-size: 18px; margin-bottom: 8px; }
    .empty-state .pin-btn { max-width: 240px; }
    .cat-tag { font-size: 11px; color: var(--text-muted); background: #2c2c2e; padding: 2px 8px; border-radius: 8px; }
    .field-val a { color: var(--primary); }
  </style>
</head>
<body>

  <!-- Lock Screen -->
  <div id="lock-screen">
    <div class="shield-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.66 0 3 1.34 3 3v2h1v6H8v-6h1v-2c0-1.66 1.34-3 3-3zm-1 3v2h2v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
    </div>
    <div class="lock-title">SECURE</div>
    <div class="lock-subtitle">PIN-Protected Vault</div>

    <!-- First launch: create PIN -->
    <form class="pin-container" id="setup-section" onsubmit="event.preventDefault(); createPin();">
      <p class="lock-msg">Create a 4–8 digit PIN to protect this vault</p>
      <input type="password" id="setup-pin" class="pin-input" maxlength="8" placeholder="New PIN" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password">
      <input type="password" id="setup-confirm" class="pin-input" maxlength="8" placeholder="Confirm PIN" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password">
      <button type="submit" class="pin-btn">Create PIN</button>
      <p class="lock-error" id="setup-error"></p>
    </form>

    <!-- Unlock -->
    <form class="pin-container" id="pin-section" onsubmit="event.preventDefault(); verifyPin();">
      <p class="lock-msg">Enter your PIN</p>
      <input type="password" id="pin-input" class="pin-input" maxlength="8" placeholder="••••" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password">
      <button type="submit" class="pin-btn" id="unlock-btn">Unlock SECURE</button>
      <p class="lock-error" id="pin-error"></p>
      <button type="button" class="reset-link" onclick="resetVault()">Forgot PIN? Erase vault and start over</button>
    </form>
  </div>

  <!-- Header -->
  <header>
    <div class="app-brand">
      <svg width="24" height="24" fill="#007aff" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6c1.66 0 3 1.34 3 3v2h1v6H8v-6h1v-2c0-1.66 1.34-3 3-3z"/></svg>
      <h1>SECURE</h1>
      <span class="badge" id="account-pill">Locked</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="lockVault()">Lock</button>
      <button class="icon-btn" onclick="openImport()">Import</button>
      <button class="icon-btn" onclick="exportData()">Backup</button>
    </div>
  </header>
  <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">

  <!-- Filter & Search Controls -->
  <section class="controls">
    <input type="text" id="search-input" class="search-box" placeholder="Search passwords, accounts, notes..." oninput="handleSearch()">
    <div class="categories" id="cat-chips">
      <span class="cat-pill active" onclick="setFilter('All', this)">All</span>
      <span class="cat-pill" onclick="setFilter('Work', this)">Work</span>
      <span class="cat-pill" onclick="setFilter('Banking', this)">Banking & Cards</span>
      <span class="cat-pill" onclick="setFilter('Alarms', this)">PINs & Alarms</span>
      <span class="cat-pill" onclick="setFilter('Personal', this)">Personal</span>
    </div>
  </section>

  <!-- Passwords List -->
  <main class="vault-container" id="vault-list"></main>

  <!-- Detail Sheet Modal -->
  <div id="modal" onclick="closeModal()">
    <div class="modal-sheet" id="modal-sheet" onclick="event.stopPropagation()">
      <h2 id="modal-title">Account Details</h2>
      <div id="modal-fields"></div>
      <button class="close-modal" onclick="closeModal()">Done</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast">Copied to clipboard</div>

  <script>
    'use strict';

    const DATA_KEY = 'SECURE_VAULT_DATA';
    const PIN_KEY = 'SECURE_VAULT_PIN';
    const CATEGORIES = ['Work', 'Banking', 'Alarms', 'Personal'];

    // No data ships with the app. Records live only in this browser's localStorage.
    let records = loadRecords();
    let activeCategory = 'All';
    let searchQuery = '';
    let unlocked = false;
    let failedAttempts = 0;
    let lockoutUntil = 0;

    function loadRecords() {
      try {
        const parsed = JSON.parse(localStorage.getItem(DATA_KEY));
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecords() {
      localStorage.setItem(DATA_KEY, JSON.stringify(records));
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function copyToClipboard(text, label) {
      if (!text) {
        showToast('Nothing to copy');
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        showToast(label + ' copied');
      }).catch(() => {
        showToast('Failed to copy');
      });
    }

    /* ---------- PIN handling (salted SHA-256 via Web Crypto) ---------- */

    function bytesToHex(bytes) {
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    async function hashPin(pin, saltHex) {
      const data = new TextEncoder().encode(saltHex + ':' + pin);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return bytesToHex(new Uint8Array(digest));
    }

    function getStoredPin() {
      try {
        const p = JSON.parse(localStorage.getItem(PIN_KEY));
        return p && p.salt && p.hash ? p : null;
      } catch (e) {
        return null;
      }
    }

    function isValidPin(pin) {
      return /^[0-9]{4,8}$/.test(pin);
    }

    function cryptoAvailable() {
      return !!(window.crypto && crypto.subtle && crypto.getRandomValues);
    }

    async function createPin() {
      const err = document.getElementById('setup-error');
      const pin = document.getElementById('setup-pin').value;
      const confirmPin = document.getElementById('setup-confirm').value;
      err.textContent = '';
      if (!cryptoAvailable()) {
        err.textContent = 'This page must be opened over HTTPS to use the vault.';
        return;
      }
      if (!isValidPin(pin)) {
        err.textContent = 'PIN must be 4 to 8 digits.';
        return;
      }
      if (pin !== confirmPin) {
        err.textContent = 'PINs do not match.';
        return;
      }
      const salt = bytesToHex(crypto.getRandomValues(new Uint8Array(16)));
      const hash = await hashPin(pin, salt);
      localStorage.setItem(PIN_KEY, JSON.stringify({ salt, hash }));
      document.getElementById('setup-pin').value = '';
      document.getElementById('setup-confirm').value = '';
      unlockVault();
      showToast('PIN created');
    }

    async function verifyPin() {
      const input = document.getElementById('pin-input');
      const err = document.getElementById('pin-error');
      const pin = input.value;
      err.textContent = '';

      const now = Date.now();
      if (now < lockoutUntil) {
        err.textContent = 'Too many attempts. Try again in ' + Math.ceil((lockoutUntil - now) / 1000) + 's.';
        return;
      }
      const stored = getStoredPin();
      if (!stored) {
        showLockScreen();
        return;
      }
      if (!cryptoAvailable()) {
        err.textContent = 'This page must be opened over HTTPS to use the vault.';
        return;
      }
      const hash = await hashPin(pin, stored.salt);
      input.value = '';
      if (isValidPin(pin) && hash === stored.hash) {
        failedAttempts = 0;
        unlockVault();
        showToast('Vault Unlocked');
      } else {
        failedAttempts++;
        if (failedAttempts >= 5) {
          lockoutUntil = Date.now() + 30000 * Math.pow(2, failedAttempts - 5);
          err.textContent = 'Too many attempts. Locked for ' + Math.round((lockoutUntil - Date.now()) / 1000) + 's.';
        } else {
          err.textContent = 'Incorrect PIN';
        }
      }
    }

    function resetVault() {
      const ok = confirm('This permanently erases ALL entries stored in this browser and your PIN. Make sure you have a backup file. Continue?');
      if (!ok) return;
      localStorage.removeItem(DATA_KEY);
      localStorage.removeItem(PIN_KEY);
      records = [];
      failedAttempts = 0;
      lockoutUntil = 0;
      showLockScreen();
      showToast('Vault erased');
    }

    function showLockScreen() {
      const hasPin = !!getStoredPin();
      document.getElementById('lock-screen').style.display = 'flex';
      document.getElementById('setup-section').classList.toggle('visible', !hasPin);
      document.getElementById('pin-section').classList.toggle('visible', hasPin);
      document.getElementById('pin-error').textContent = '';
      document.getElementById('setup-error').textContent = '';
      const focusId = hasPin ? 'pin-input' : 'setup-pin';
      setTimeout(() => document.getElementById(focusId).focus(), 50);
    }

    function unlockVault() {
      unlocked = true;
      records = loadRecords();
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('account-pill').textContent = 'Unlocked';
      renderVault();
    }

    function lockVault() {
      unlocked = false;
      closeModal();
      // Remove decrypted/rendered entries from the page while locked.
      document.getElementById('vault-list').innerHTML = '';
      document.getElementById('modal-fields').innerHTML = '';
      document.getElementById('pin-input').value = '';
      document.getElementById('account-pill').textContent = 'Locked';
      showLockScreen();
    }

    /* ---------- Categories ---------- */

    const CATEGORY_RULES = [
      ['Banking', /\b(bank|banking|credit union|credit card|debit|card|visa|mastercard|crypto|bitcoin|wallet|loan|mortgage|invest|investing|brokerage|401k|ira|finance|financial|tax|insurance)\b/],
      ['Alarms', /\b(alarm|alarms|code|codes|pin|pins|passcode|door|gate|garage|safe|lock|keypad|lockbox|security system|access control|wifi|wi-fi)\b/],
      ['Work', /\b(work|business|office|company|corporate|corp|employee|payroll|hr|vpn|intranet|portal|vendor|supplier|distributor|crm|erp)\b/]
    ];

    function categoryFromText(text) {
      const t = (text || '').toLowerCase();
      for (const [cat, re] of CATEGORY_RULES) {
        if (re.test(t)) return cat;
      }
      return null;
    }

    function categorize(item) {
      if (item.category && CATEGORIES.includes(item.category)) return item.category;
      if (item.$type === 'bankCard' || item.$type === 'bankAccount') return 'Banking';
      return categoryFromText(item.title) || categoryFromText(item.login_url) || 'Personal';
    }

    function setFilter(cat, elem) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
      elem.classList.add('active');
      renderVault();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase();
      renderVault();
    }

    /* ---------- Rendering (DOM APIs only; imported text is never parsed as HTML) ---------- */

    function el(tag, opts, children) {
      const node = document.createElement(tag);
      if (opts) {
        if (opts.className) node.className = opts.className;
        if (opts.text !== undefined) node.textContent = opts.text;
        if (opts.style) node.setAttribute('style', opts.style);
        if (opts.onclick) node.addEventListener('click', opts.onclick);
      }
      (children || []).forEach(c => c && node.appendChild(c));
      return node;
    }

    function renderEmptyState(container) {
      const btn = el('button', { className: 'pin-btn', text: 'Import Backup', onclick: openImport });
      container.appendChild(el('div', { className: 'empty-state' }, [
        el('h3', { text: 'Your vault is empty' }),
        el('p', { text: 'Tap Import to load your backup — either a SECURE backup file or a Keeper JSON export. Your data is stored only in this browser on this device.' }),
        el('div', { style: 'margin-top:20px;display:flex;justify-content:center;' }, [btn])
      ]));
    }

    function renderVault() {
      const container = document.getElementById('vault-list');
      container.innerHTML = '';
      if (!unlocked) return;

      if (records.length === 0) {
        renderEmptyState(container);
        return;
      }

      const filtered = records.filter(item => {
        const title = (item.title || '').toLowerCase();
        const login = (item.login || '').toLowerCase();
        const notes = (item.notes || '').toLowerCase();
        const matchesSearch = title.includes(searchQuery) || login.includes(searchQuery) || notes.includes(searchQuery);
        const matchesCat = activeCategory === 'All' || categorize(item) === activeCategory;
        return matchesSearch && matchesCat;
      });

      if (filtered.length === 0) {
        container.appendChild(el('div', { style: 'text-align:center;color:#666;padding:40px;', text: 'No entries found.' }));
        return;
      }

      filtered.forEach(r => {
        const actions = [];
        if (r.login) actions.push(el('button', { className: 'act-btn', text: 'Copy User', onclick: e => { e.stopPropagation(); copyToClipboard(r.login, 'User'); } }));
        if (r.password) actions.push(el('button', { className: 'act-btn', text: 'Copy Pass', onclick: e => { e.stopPropagation(); copyToClipboard(r.password, 'Password'); } }));
        actions.push(el('button', { className: 'act-btn', style: 'flex:0.6; background:#3a3a3c;', text: 'Details', onclick: e => { e.stopPropagation(); openDetails(r); } }));

        container.appendChild(el('div', { className: 'record-card' }, [
          el('div', { className: 'card-top' }, [
            el('span', { className: 'record-title', text: r.title || 'Untitled' }),
            el('span', { className: 'cat-tag', text: categorize(r) })
          ]),
          el('div', { className: 'record-meta', text: r.login || (r.notes ? 'Contains secure notes/code' : 'No username') }),
          el('div', { className: 'action-row' }, actions)
        ]));
      });
    }

    function fieldRow(label, value, copyLabel, pre) {
      const row = el('div', { className: 'field-row', onclick: copyLabel ? () => copyToClipboard(value, copyLabel) : null }, [
        el('div', { className: 'field-label', text: label }),
        el('div', { className: 'field-val', text: value, style: pre ? 'white-space: pre-wrap;' : '' })
      ]);
      return row;
    }

    function safeUrl(url) {
      try {
        const u = new URL(/^[a-z][a-z0-9+.-]*:/i.test(url) ? url : 'https://' + url);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : null;
      } catch (e) {
        return null;
      }
    }

    function openDetails(r) {
      if (!unlocked || !r) return;
      document.getElementById('modal-title').textContent = r.title || 'Details';
      const f = document.getElementById('modal-fields');
      f.innerHTML = '';

      if (r.login) f.appendChild(fieldRow('Username / Login (Tap to copy)', r.login, 'Username'));
      if (r.password) f.appendChild(fieldRow('Password (Tap to copy)', r.password, 'Password'));
      if (r.notes) f.appendChild(fieldRow('Notes / Codes (Tap to copy)', r.notes, 'Notes', true));
      if (r.login_url) {
        const href = safeUrl(r.login_url);
        const val = el('div', { className: 'field-val' });
        if (href) {
          const a = el('a', { text: r.login_url });
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          val.appendChild(a);
        } else {
          val.textContent = r.login_url;
        }
        f.appendChild(el('div', { className: 'field-row' }, [el('div', { className: 'field-label', text: 'Website' }), val]));
      }

      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    /* ---------- Backup export ---------- */

    function exportData() {
      if (!unlocked) return;
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `secure-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Vault exported');
    }

    /* ---------- Import (SECURE backup or Keeper JSON export) ---------- */

    function openImport() {
      if (!unlocked) return;
      const input = document.getElementById('import-file');
      input.value = '';
      input.click();
    }

    function asText(v) {
      if (v === null || v === undefined) return '';
      if (Array.isArray(v)) return v.map(asText).filter(Boolean).join(', ');
      if (typeof v === 'object') {
        return Object.entries(v).map(([k, val]) => {
          const s = asText(val);
          return s ? `${k}: ${s}` : '';
        }).filter(Boolean).join(', ');
      }
      return String(v);
    }

    // Keeper custom field keys look like "$pinCode::1", "$oneTimeCode::1" or "My Label".
    function prettyFieldName(key) {
      const base = String(key).replace(/::\d+$/, '').replace(/^\$/, '');
      const spaced = base.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]+/g, ' ');
      return spaced.charAt(0).toUpperCase() + spaced.slice(1);
    }

    function folderNames(folders) {
      if (!Array.isArray(folders)) return [];
      const names = [];
      folders.forEach(f => {
        if (typeof f === 'string') names.push(f);
        else if (f && typeof f === 'object') {
          if (f.shared_folder) names.push(f.shared_folder);
          if (f.folder) names.push(f.folder);
        }
      });
      return names;
    }

    function categoryFromFolders(names) {
      for (const name of names) {
        const cat = categoryFromText(name);
        if (cat) return cat;
        if (/\b(personal|family|private|social|shopping|entertainment)\b/i.test(name)) return 'Personal';
      }
      return null;
    }

    function mapKeeperRecord(k) {
      if (!k || typeof k !== 'object') return null;
      const rec = {
        title: asText(k.title),
        login: asText(k.login),
        password: asText(k.password)
      };
      if (k.$type) rec.$type = asText(k.$type);
      if (k.login_url) rec.login_url = asText(k.login_url);

      const noteParts = [];
      if (k.notes) noteParts.push(asText(k.notes));
      if (k.custom_fields && typeof k.custom_fields === 'object') {
        const lines = Object.entries(k.custom_fields)
          .map(([key, val]) => {
            const s = asText(val);
            return s ? `${prettyFieldName(key)}: ${s}` : '';
          })
          .filter(Boolean);
        if (lines.length) noteParts.push(lines.join('\n'));
      }
      if (noteParts.length) rec.notes = noteParts.join('\n\n');

      const folders = folderNames(k.folders);
      if (folders.length) rec.folder = folders.join(' / ');

      if (k.category && CATEGORIES.includes(k.category)) {
        rec.category = k.category;
      } else {
        rec.category = categoryFromFolders(folders) || categorize(rec);
      }

      if (!rec.title && !rec.login && !rec.password && !rec.notes) return null;
      return rec;
    }

    function recordKey(r) {
      return [r.title || '', r.login || '', r.password || '', r.login_url || ''].join('\u0000');
    }

    function importParsed(data) {
      let incoming;
      if (Array.isArray(data)) incoming = data;                       // SECURE backup (array of records)
      else if (data && Array.isArray(data.records)) incoming = data.records; // Keeper export
      else throw new Error('Unrecognized file format');

      const mapped = incoming.map(mapKeeperRecord).filter(Boolean);
      const seen = new Set(records.map(recordKey));
      let added = 0;
      mapped.forEach(r => {
        const key = recordKey(r);
        if (!seen.has(key)) {
          seen.add(key);
          records.push(r);
          added++;
        }
      });
      saveRecords();
      renderVault();
      return { added, skipped: mapped.length - added };
    }

    function handleImportFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const res = importParsed(JSON.parse(reader.result));
          showToast(`Imported ${res.added} entr${res.added === 1 ? 'y' : 'ies'}` + (res.skipped ? ` (${res.skipped} duplicates skipped)` : ''));
        } catch (e) {
          showToast('Import failed: not a valid backup or Keeper JSON file');
        }
        event.target.value = '';
      };
      reader.onerror = () => showToast('Could not read file');
      reader.readAsText(file);
    }

    // Auto-lock whenever the app is backgrounded or hidden.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) lockVault();
    });
    window.addEventListener('pagehide', lockVault);

    showLockScreen();
  </script>
</body>
</html>
